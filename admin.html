<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body>

    <h2>Admin Dashboard</h2>

    <h3 id="segmentName"></h3>

    <p>
        Candidate #
        <span id="candidateNumber"></span>
    </p>

    <h2 id="candidateName"></h2>

    <button id="prevBtn">
        ◀ Previous
    </button>

    <button id="nextBtn">
        Next ▶
    </button>

            <hr>
        
        <h3>Timer</h3>
        
        <div id="timerDisplay">
            00:00
        </div>
        
        <p id="timerStatus">
            Stopped
        </p>
        
        <button id="startTimerBtn">
            Start
        </button>
        
        <button id="pauseTimerBtn">
            Pause
        </button>
        
        <button id="resumeTimerBtn">
            Resume
        </button>
        
        <button id="stopTimerBtn">
            Stop
        </button>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>

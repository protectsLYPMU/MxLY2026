<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <div id="connectionStatus" class="online">
        ● Connected
    </div>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <button id="logoutBtn">Logout</button>
</head>
<body>

    <h2>Admin Dashboard</h2>

    <h3 id="segmentName"></h3>

    <div class="candidate-photo-wrapper">
    <img
        id="candidatePhoto"
        class="candidate-photo"
        src="images/candidates/default.png"
    >
    </div>

    <p>
        Candidate #
        <span id="candidateNumber"></span>
    </p>

    <h2 id="candidateName"></h2>

    <button id="prevBtn">
        ◀ Previous
    </button>

    <button id="nextBtn">
        Next ▶
    </button>

    <div class="jump-panel">

        <label>Jump to Performance</label>
    
        <select id="performanceSelect">
            <option>Loading...</option>
        </select>
    
        <button id="jumpBtn">
            Jump
        </button>
    
    </div>

            <hr>
        
        <h3>Timer</h3>
        
        <div id="timerDisplay">
            00:00
        </div>
        
        <p id="timerStatus">
            Stopped
        </p>
        
        <button id="startTimerBtn">
            Start
        </button>
        
        <button id="pauseTimerBtn">
            Pause
        </button>
        
        <button id="resumeTimerBtn">
            Resume
        </button>
        
        <button id="stopTimerBtn">
            Stop
        </button>

    <br>
    <button id="openScoringBtn">
      Open Scoring
    </button>
    
    <button id="closeScoringBtn">
      Close Scoring
    </button>
    
    <div id="scoringStatus">SCORING CLOSED</div>

        <hr>
    
    <h3>Judge Status</h3>
    
    <div id="judgeStatusContainer">
        Loading...
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>

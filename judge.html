<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Judge Scoring</title>

    <link rel="stylesheet" href="css/judge.css">

</head>

<body>

    <!-- Loading Modal -->
    <div id="loadingModal" class="loading-overlay">

        <div class="loading-box">

            <div class="spinner"></div>

            <h3 id="loadingMessage">
                Please wait...
            </h3>

        </div>

    </div>

    <div class="judge-container">

        <!-- Header Banner -->
        <header class="page-header">

            <div id="connectionStatus" class="online">
                ● Connected
            </div>

            <img src="images/banner.png"
                 class="header-banner"
                 alt="Circle of Love">

            <h1 class="page-title">
                Judge Page
            </h1>

        </header>

        <!-- Top Status Bar -->
        <section class="status-bar">

            <div class="judge-info">
                Judge:
                <span id="judgeName">
                    Loading...
                </span>
            </div>

            <div id="timerDisplay" class="timer">
                00:00
            </div>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </section>

        <!-- Candidate Card -->
        <section class="candidate-card">

            <img
                id="candidatePhoto"
                class="candidate-photo"
                src="images/candidates/default.png"
                alt="Candidate Photo"
            >

            <div class="candidate-info">

                <div id="segmentName" class="category">
                    Loading...
                </div>

                <div class="candidate-panel">

                    <p class="candidate-number">
                        Candidate #
                        <span id="candidateNumber">
                            --
                        </span>
                    </p>

                    <h2 id="candidateName" class="candidate-name">
                        Loading...
                    </h2>

                </div>

            </div>

        </section>

        <!-- Score Grid -->
        <section id="scoreButtons" class="score-grid">

            <button class="score-btn" data-score="1">1</button>
            <button class="score-btn" data-score="2">2</button>
            <button class="score-btn" data-score="3">3</button>
            <button class="score-btn" data-score="4">4</button>
            <button class="score-btn" data-score="5">5</button>
            <button class="score-btn" data-score="6">6</button>
            <button class="score-btn" data-score="7">7</button>
            <button class="score-btn" data-score="8">8</button>
            <button class="score-btn" data-score="9">9</button>
            <button class="score-btn" data-score="10">10</button>

        </section>

        <!-- Submit -->
        <button id="submitScoreBtn" class="submit-btn" disabled>
            Submit
        </button>

        <p id="scoreMessage" class="score-message"></p>

    </div>

    <script src="js/api.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/judge.js"></script>

</body>

</html>
